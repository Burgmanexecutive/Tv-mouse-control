plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tvmouse.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tvmouse.phone'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            java.srcDir '../shared/src/main/java'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
