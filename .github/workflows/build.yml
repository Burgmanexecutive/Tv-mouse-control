name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accetta le licenze dell'SDK Android (già installato sul runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Usa la chiave di firma fissa (se configurata)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Chiave di firma fissa installata."
          else
            echo "Nessuna chiave fissa configurata: gli APK useranno una chiave temporanea."
          fi

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Compila gli APK (telefono + TV)
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: tvmouse-apk
          path: |
            phone/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compila i programmi per PC (JAR eseguibili)
        run: |
          mkdir -p out dist-controllo dist-ricevitore
          javac --release 11 -d out shared/src/main/java/app/tvmouse/common/*.java desktop/src/main/java/app/tvmouse/desktop/*.java
          printf 'Main-Class: app.tvmouse.desktop.Main\n' > manifest1.txt
          jar --create --file dist-controllo/TvMouse-PC.jar --manifest manifest1.txt -C out .
          cp desktop/Avvia-TvMouse.* dist-controllo/
          printf 'Main-Class: app.tvmouse.desktop.Receiver\n' > manifest2.txt
          jar --create --file dist-ricevitore/TvMouse-Ricevitore-PC.jar --manifest manifest2.txt -C out .
          cp desktop/Avvia-Ricevitore-PC.* dist-ricevitore/

      # PC che comanda la TV
      - uses: actions/upload-artifact@v6
        with:
          name: tvmouse-pc-controlla-tv
          path: dist-controllo/*

      # PC comandato dal telefono
      - uses: actions/upload-artifact@v6
        with:
          name: tvmouse-pc-ricevitore
          path: dist-ricevitore/*
